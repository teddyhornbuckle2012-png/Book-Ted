<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BOOK TED — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8D08A;
    --gold-dim: #7a6530;
    --black: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --text: #f0e8d8;
    --text-muted: #8a7a60;
    --green: #4caf7d;
    --red: #c94c4c;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--text); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; font-weight: 300; min-height: 100vh; }
  .top-rule { width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  /* ── Login ── */
  #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-card { background: var(--surface); border: 1px solid #2a2318; padding: 48px 40px; max-width: 400px; width: 100%; position: relative; text-align: center; animation: fadeUp 0.6s ease both; }
  .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .corner { position: absolute; width: 16px; height: 16px; border-color: var(--gold); border-style: solid; }
  .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .login-logo { font-family: 'Cinzel', serif; font-size: 36px; font-weight: 900; letter-spacing: 0.18em; background: linear-gradient(135deg, var(--gold-dim), var(--gold), var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }
  .login-sub { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.3em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 36px; }
  .login-field { display: flex; flex-direction: column; margin-bottom: 24px; text-align: left; }
  .login-field label { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.3em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 8px; }
  .login-field input { background: var(--surface2); border: 1px solid #2a2318; border-bottom: 1px solid var(--gold-dim); color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 16px; padding: 10px 14px; outline: none; border-radius: 0; }
  .login-field input:focus { border-color: var(--gold); }
  .btn-login { width: 100%; background: linear-gradient(135deg, #1a1408, #2a2010); border: 1px solid var(--gold-dim); color: var(--gold); font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; padding: 16px; cursor: pointer; transition: all 0.25s; }
  .btn-login:hover { border-color: var(--gold); color: var(--gold-light); }
  .login-error { color: var(--red); font-size: 13px; font-style: italic; margin-top: 12px; display: none; }

  /* ── Dashboard ── */
  #dashboard { display: none; }
  .dash-header { padding: 32px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2318; }
  .dash-logo { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 900; letter-spacing: 0.18em; background: linear-gradient(135deg, var(--gold-dim), var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .dash-sub { font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 0.3em; color: var(--gold-dim); text-transform: uppercase; margin-top: 2px; }
  .btn-logout { background: none; border: 1px solid #2a2318; color: var(--text-muted); font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; padding: 8px 16px; cursor: pointer; transition: all 0.2s; }
  .btn-logout:hover { border-color: var(--gold-dim); color: var(--gold); }

  .dash-content { padding: 40px; max-width: 900px; margin: 0 auto; }
  .dash-title { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; }
  .dash-title::after { content: ''; flex: 1; height: 1px; background: #2a2318; }

  /* ── Filter tabs ── */
  .filter-tabs { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
  .tab { background: none; border: 1px solid #2a2318; color: var(--text-muted); font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; padding: 8px 18px; cursor: pointer; transition: all 0.2s; }
  .tab.active, .tab:hover { border-color: var(--gold-dim); color: var(--gold); }

  /* ── Booking cards ── */
  .bookings-list { display: flex; flex-direction: column; gap: 16px; }
  .booking-card { background: var(--surface); border: 1px solid #2a2318; border-left: 2px solid var(--gold-dim); padding: 24px 28px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; animation: fadeUp 0.4s ease both; }
  .booking-card.confirmed { border-left-color: var(--green); }
  .booking-card.declined { border-left-color: var(--red); opacity: 0.6; }
  .booking-card.cancelled { border-left-color: var(--text-muted); opacity: 0.6; }
  .booking-name { font-family: 'Cinzel', serif; font-size: 14px; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 10px; }
  .booking-details { display: flex; flex-wrap: wrap; gap: 16px; }
  .booking-detail { font-size: 14px; color: var(--text-muted); }
  .booking-detail span { color: var(--text); }
  .booking-status { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; padding: 4px 12px; border: 1px solid; margin-bottom: 12px; display: inline-block; }
  .status-pending { color: var(--gold); border-color: var(--gold-dim); }
  .status-confirmed { color: var(--green); border-color: var(--green); }
  .status-declined { color: var(--red); border-color: var(--red); }
  .status-cancelled { color: var(--text-muted); border-color: var(--text-muted); }
  .btn-cancel { background: linear-gradient(135deg, #1a1408, #2a2010); border: 1px solid var(--gold-dim); color: var(--gold-dim); font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; padding: 10px 16px; cursor: pointer; transition: all 0.2s; }
  .btn-cancel:hover { border-color: var(--red); color: var(--red); }
  .btn-paid { background: linear-gradient(135deg, #1a1408, #2a2010); border: 1px solid var(--gold); color: var(--gold); font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; padding: 10px 16px; cursor: pointer; transition: all 0.2s; }
  .btn-paid:hover { background: #2a2010; box-shadow: 0 0 12px rgba(201,168,76,0.18); }
  .booking-actions { display: flex; flex-direction: column; gap: 10px; min-width: 130px; }
  .btn-confirm { background: linear-gradient(135deg, #0a1a0f, #0f2a18); border: 1px solid var(--green); color: var(--green); font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; padding: 10px 16px; cursor: pointer; transition: all 0.2s; }
  .btn-confirm:hover { background: #0f2a18; box-shadow: 0 0 12px rgba(76,175,125,0.15); }
  .btn-decline { background: linear-gradient(135deg, #1a0a0a, #2a0f0f); border: 1px solid var(--red); color: var(--red); font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; padding: 10px 16px; cursor: pointer; transition: all 0.2s; }
  .btn-decline:hover { background: #2a0f0f; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-style: italic; }
  .loading { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }

  /* ── Availability calendar ── */
  .avail-section { background: var(--surface); border: 1px solid #2a2318; border-top: 1px solid var(--gold-dim); padding: 28px 32px; margin-bottom: 40px; position: relative; }
  .avail-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .cal-title { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button { background: none; border: 1px solid #2a2318; color: var(--gold-dim); font-family: 'Cinzel', serif; font-size: 11px; padding: 6px 12px; cursor: pointer; transition: all 0.2s; }
  .cal-nav button:hover { border-color: var(--gold); color: var(--gold); }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .cal-weekday { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; color: var(--gold-dim); text-align: center; padding: 6px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day { aspect-ratio: 1; background: var(--surface2); border: 1px solid #2a2318; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; cursor: pointer; transition: all 0.15s; position: relative; }
  .cal-day:hover { border-color: var(--gold-dim); }
  .cal-day.other-month { opacity: 0.3; cursor: default; }
  .cal-day.past { opacity: 0.35; cursor: not-allowed; background: transparent; }
  .cal-day.today { border-color: var(--gold-dim); }
  .cal-day.selected { border-color: var(--gold); background: #1a1508; }
  .cal-day.has-slots { border-color: var(--gold-dim); }
  .cal-daynum { font-family: 'Cinzel', serif; font-size: 13px; color: var(--text); }
  .cal-day.past .cal-daynum, .cal-day.other-month .cal-daynum { color: var(--text-muted); }
  .cal-dot { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); margin-top: 6px; }
  .cal-count { font-family: 'Cinzel', serif; font-size: 9px; color: var(--gold); margin-top: 2px; letter-spacing: 0.1em; }
  .day-detail { margin-top: 22px; border-top: 1px solid #2a2318; padding-top: 22px; display: none; }
  .day-detail.open { display: block; }
  .day-detail-header { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase; margin-bottom: 16px; }
  .slot-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border: 1px solid #2a2318; padding: 10px 14px; margin-bottom: 8px; }
  .slot-row .slot-time { font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold); letter-spacing: 0.15em; }
  .slot-row .btn-remove { background: none; border: 1px solid #3a1818; color: var(--red); font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.2em; padding: 6px 10px; cursor: pointer; }
  .slot-row .btn-remove:hover { background: #2a0f0f; }
  .add-slot-form { display: flex; gap: 8px; margin-top: 14px; }
  .add-slot-form input { flex: 1; background: var(--surface2); border: 1px solid #2a2318; border-bottom: 1px solid var(--gold-dim); color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 16px; padding: 10px 14px; outline: none; border-radius: 0; }
  .add-slot-form input:focus { border-color: var(--gold); }
  .add-slot-form button { background: linear-gradient(135deg, #1a1408, #2a2010); border: 1px solid var(--gold-dim); color: var(--gold); font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.25em; padding: 0 18px; cursor: pointer; }
  .add-slot-form button:hover { border-color: var(--gold); color: var(--gold-light); }
  .day-empty { color: var(--text-muted); font-style: italic; font-size: 14px; margin-bottom: 8px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 600px) { .dash-header { padding: 20px; } .dash-content { padding: 20px; } .booking-card { grid-template-columns: 1fr; } .booking-actions { flex-direction: row; } .avail-section { padding: 22px 18px; } .cal-day { padding: 4px; } .cal-daynum { font-size: 11px; } }
</style>
</head>
<body>
<div class="top-rule"></div>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="login-logo">BOOK TED</div>
    <div class="login-sub">Admin Access</div>
    <form onsubmit="event.preventDefault(); login();" autocomplete="on">
      <input type="text" name="username" value="ted" autocomplete="username" readonly style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;" tabindex="-1" aria-hidden="true" />
      <div class="login-field">
        <label>Password</label>
        <input type="password" id="passwordInput" name="password" autocomplete="current-password" placeholder="Enter your password" />
      </div>
      <button class="btn-login" type="submit">Enter Dashboard</button>
    </form>
    <div class="login-error" id="loginError">Incorrect password. Please try again.</div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="dash-header">
    <div>
      <div class="dash-logo">BOOK TED</div>
      <div class="dash-sub">Admin Dashboard</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-logout" onclick="sendTest()">Test</button>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <div class="dash-content">
    <div class="dash-title">Availability</div>
    <div class="avail-section">
      <div class="cal-header">
        <div class="cal-title" id="calMonthLabel">—</div>
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">‹ PREV</button>
          <button onclick="changeMonth(1)">NEXT ›</button>
        </div>
      </div>
      <div class="cal-weekdays">
        <div class="cal-weekday">SUN</div>
        <div class="cal-weekday">MON</div>
        <div class="cal-weekday">TUE</div>
        <div class="cal-weekday">WED</div>
        <div class="cal-weekday">THU</div>
        <div class="cal-weekday">FRI</div>
        <div class="cal-weekday">SAT</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-detail" id="dayDetail">
        <div class="day-detail-header" id="dayDetailHeader">—</div>
        <div id="dayDetailSlots"></div>
        <form class="add-slot-form" onsubmit="addSlot(event)">
          <input type="time" id="newSlotTime" required />
          <button type="submit">Add Time</button>
        </form>
      </div>
    </div>

    <div class="dash-title">Booking Requests</div>

    <div class="filter-tabs">
      <button class="tab active" onclick="filterBookings('all', this)">All</button>
      <button class="tab" onclick="filterBookings('pending', this)">Pending</button>
      <button class="tab" onclick="filterBookings('confirmed', this)">Confirmed</button>
      <button class="tab" onclick="filterBookings('declined', this)">Declined</button>
      <button class="tab" onclick="filterBookings('cancelled', this)">Cancelled</button>
    </div>

    <div class="bookings-list" id="bookingsList">
      <div class="loading">Loading bookings...</div>
    </div>
  </div>
</div>

<script>
  const ADMIN_PASSWORD = 'Lessreverb1#LOL';
  let allBookings = [];
  let currentFilter = 'all';
  let allSlots = [];
  let calCursor = new Date();
  calCursor.setDate(1);
  let selectedDate = null;
  const MONTH_NAMES = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

  function login() {
    const pw = document.getElementById('passwordInput').value;
    if (pw === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadBookings();
      loadSlots();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }

  async function sendTest() {
    const to = prompt('Send a test email to:', 'jadelouisedixon2015@yahoo.com');
    if (!to) return;
    try {
      const res = await fetch('/api/test-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to })
      });
      if (res.ok) {
        alert('Test email sent to ' + to + '.\n\nCheck the inbox — and the spam folder.');
      } else {
        alert('Test email failed:\n\n' + await readError(res));
      }
    } catch (e) {
      alert('Test email failed:\n\n' + (e && e.message ? e.message : e));
    }
  }

  async function readError(res) {
    try {
      const data = await res.clone().json();
      return data.error || data.message || JSON.stringify(data);
    } catch {
      try { return await res.text(); } catch { return `HTTP ${res.status}`; }
    }
  }

  async function loadBookings() {
    try {
      const res = await fetch('/api/get-bookings');
      if (!res.ok) {
        const msg = await readError(res);
        document.getElementById('bookingsList').innerHTML = `<div class="empty-state">Could not load bookings.<br/><br/><span style="font-size:12px;">${msg}</span></div>`;
        return;
      }
      const data = await res.json();
      allBookings = Array.isArray(data) ? data : [];
      renderBookings();
    } catch (e) {
      document.getElementById('bookingsList').innerHTML = `<div class="empty-state">Could not load bookings.<br/><br/><span style="font-size:12px;">${e.message}</span></div>`;
    }
  }

  function filterBookings(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderBookings();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderBookings() {
    const list = document.getElementById('bookingsList');
    const filtered = currentFilter === 'all' ? allBookings : allBookings.filter(b => b.status === currentFilter);

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">No bookings found.</div>';
      return;
    }

    list.innerHTML = filtered.map(b => {
      const statusUpper = (b.status || '').toUpperCase();
      return `
        <div class="booking-card ${escapeHtml(b.status)}" data-booking-id="${escapeHtml(b.id)}">
          <div>
            <div class="booking-name">${escapeHtml(b.first_name)} ${escapeHtml(b.last_name)}</div>
            <div class="booking-status status-${escapeHtml(b.status)}">${escapeHtml(statusUpper)}</div>
            <div class="booking-details">
              <div class="booking-detail">📧 <span>${escapeHtml(b.email)}</span></div>
              <div class="booking-detail">📱 <span>${escapeHtml(b.phone || '—')}</span></div>
              <div class="booking-detail">📍 <span>${escapeHtml(b.location)}</span></div>
              <div class="booking-detail">🕐 <span>${escapeHtml(b.slot_time)}</span></div>
              <div class="booking-detail">💳 <span>${b.paid ? 'Paid' : 'Unpaid'}</span></div>
            </div>
          </div>
          <div class="booking-actions">
            ${b.status === 'pending' ? `
              <button class="btn-confirm" data-action="confirm">✓ CONFIRM</button>
              <button class="btn-decline" data-action="decline">✗ DECLINE</button>
            ` : b.status === 'confirmed' ? `
              ${!b.paid ? `<button class="btn-paid" data-action="mark-paid">£ MARK AS PAID</button>` : ''}
              <button class="btn-cancel" data-action="cancel">CANCEL</button>
            ` : `<div style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.2em;color:var(--text-muted);">${escapeHtml(statusUpper)}</div>`}
          </div>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.booking-card').forEach(card => {
      const id = card.dataset.bookingId;
      card.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const b = allBookings.find(x => x.id === id);
          if (!b) return;
          if (btn.dataset.action === 'mark-paid') {
            if (!confirm(`Mark this booking as paid? The customer will be emailed an invoice (PDF) confirming payment of £7.50.`)) return;
            btn.disabled = true;
            btn.textContent = 'PROCESSING…';
            markAsPaid(b, btn);
            return;
          }
          let newStatus;
          let paymentLink = '';
          if (btn.dataset.action === 'confirm') {
            newStatus = 'confirmed';
            paymentLink = prompt('Paste a payment link to include in the confirmation email (optional — leave blank to text the details instead):') || '';
          } else if (btn.dataset.action === 'cancel') {
            if (!confirm('Cancel this confirmed booking? The customer will be emailed and the slot will not be re-opened.')) return;
            newStatus = 'cancelled';
          } else newStatus = 'declined';
          updateBooking(b.id, newStatus, b.email, b.first_name, b.last_name, b.phone, b.location, b.slot_time, b.slot_id || '', paymentLink);
        });
      });
    });
  }

  async function updateBooking(id, status, email, firstName, lastName, phone, location, slotTime, slotId, paymentLink) {
    const res = await fetch('/api/update-booking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status, email, firstName, lastName, phone, location, slotTime, slotId, paymentLink })
    });

    if (res.ok) {
      allBookings = allBookings.map(b => b.id === id ? { ...b, status } : b);
      renderBookings();
      if (status === 'declined') loadSlots();
    } else {
      alert('Something went wrong:\n\n' + await readError(res));
    }
  }

  async function markAsPaid(b, btn) {
    const res = await fetch('/api/mark-paid', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: b.id,
        firstName: b.first_name,
        lastName: b.last_name,
        email: b.email,
        phone: b.phone,
        location: b.location,
        slotTime: b.slot_time
      })
    });
    if (res.ok) {
      allBookings = allBookings.map(x => x.id === b.id ? { ...x, paid: true } : x);
      renderBookings();
    } else {
      alert('Could not mark as paid:\n\n' + await readError(res));
      if (btn) { btn.disabled = false; btn.textContent = '£ MARK AS PAID'; }
    }
  }

  /* ── Availability calendar ── */
  async function loadSlots() {
    try {
      const res = await fetch('/api/get-slots');
      if (!res.ok) {
        const msg = await readError(res);
        alert('Could not load availability:\n\n' + msg);
        allSlots = [];
      } else {
        const data = await res.json();
        allSlots = Array.isArray(data) ? data : [];
      }
    } catch (e) {
      allSlots = [];
    }
    renderCalendar();
    if (selectedDate) renderDayDetail();
  }

  function ymd(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function changeMonth(delta) {
    calCursor.setMonth(calCursor.getMonth() + delta);
    renderCalendar();
  }

  function renderCalendar() {
    const grid = document.getElementById('calGrid');
    const label = document.getElementById('calMonthLabel');
    label.textContent = `${MONTH_NAMES[calCursor.getMonth()]} ${calCursor.getFullYear()}`;

    const today = new Date(); today.setHours(0,0,0,0);
    const firstOfMonth = new Date(calCursor.getFullYear(), calCursor.getMonth(), 1);
    const startOffset = firstOfMonth.getDay();
    const start = new Date(firstOfMonth);
    start.setDate(start.getDate() - startOffset);

    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const dateStr = ymd(d);
      const isOtherMonth = d.getMonth() !== calCursor.getMonth();
      const isPast = d < today;
      const isToday = d.getTime() === today.getTime();
      const slotsThisDay = allSlots.filter(s => s.slot_date === dateStr);
      const cls = ['cal-day'];
      if (isOtherMonth) cls.push('other-month');
      if (isPast) cls.push('past');
      if (isToday) cls.push('today');
      if (selectedDate === dateStr) cls.push('selected');
      if (slotsThisDay.length > 0) cls.push('has-slots');

      const clickable = !isPast && !isOtherMonth;
      cells.push(`
        <div class="${cls.join(' ')}" ${clickable ? `onclick="selectDate('${dateStr}')"` : ''}>
          <div class="cal-daynum">${d.getDate()}</div>
          ${slotsThisDay.length > 0 ? `<div class="cal-count">${slotsThisDay.length}</div>` : ''}
        </div>
      `);
    }
    grid.innerHTML = cells.join('');
  }

  function selectDate(dateStr) {
    selectedDate = dateStr;
    renderCalendar();
    renderDayDetail();
  }

  function renderDayDetail() {
    const detail = document.getElementById('dayDetail');
    const header = document.getElementById('dayDetailHeader');
    const list = document.getElementById('dayDetailSlots');
    if (!selectedDate) { detail.classList.remove('open'); return; }

    detail.classList.add('open');
    const d = new Date(selectedDate + 'T00:00:00');
    const DOW = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
    header.textContent = `${DOW[d.getDay()]} · ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;

    const slotsThisDay = allSlots.filter(s => s.slot_date === selectedDate)
      .sort((a, b) => a.slot_time.localeCompare(b.slot_time));

    if (slotsThisDay.length === 0) {
      list.innerHTML = '<div class="day-empty">No times added for this date yet.</div>';
    } else {
      list.innerHTML = slotsThisDay.map(s => `
        <div class="slot-row">
          <div class="slot-time">${s.slot_time}</div>
          <button class="btn-remove" onclick="removeSlot('${s.id}')">✗ REMOVE</button>
        </div>
      `).join('');
    }
  }

  async function addSlot(ev) {
    ev.preventDefault();
    if (!selectedDate) { alert('Pick a date on the calendar first.'); return; }
    const timeInput = document.getElementById('newSlotTime');
    const time = timeInput.value;
    if (!time) return;

    const res = await fetch('/api/add-slot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slot_date: selectedDate, slot_time: time })
    });
    if (res.ok) {
      timeInput.value = '';
      await loadSlots();
    } else {
      const msg = await readError(res);
      if (msg.toLowerCase().includes('duplicate')) {
        alert('That time is already added for this date.');
      } else {
        alert('Could not add slot:\n\n' + msg);
      }
    }
  }

  async function removeSlot(id) {
    if (!confirm('Remove this time slot?')) return;
    const res = await fetch('/api/delete-slot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    if (res.ok) {
      await loadSlots();
    } else {
      alert('Could not remove slot:\n\n' + await readError(res));
    }
  }
</script>
</body>
</html>
